<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>절대 누르지마</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffc0cb;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Helvetica Neue", sans-serif;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  #text {
    color: #ff0000;
    font-size: clamp(32px, 9vw, 72px);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    padding: 16px;
    text-align: center;
  }
  #photo {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #photo.show { display: block; }
</style>
</head>
<body>
  <div id="text">절대 누르지마</div>
  <img id="photo" src="photo.jpg" alt="">
  <audio id="song" src="song.mp3" preload="auto" loop></audio>
<script>
  const text = document.getElementById('text');
  const photo = document.getElementById('photo');
  const song = document.getElementById('song');
  let step = 0;

  text.addEventListener('click', () => {
    if (step === 0) {
      text.textContent = '누르지말라니까?';
      step = 1;
      return;
    }
    text.style.display = 'none';
    photo.classList.add('show');
    song.play().catch(() => {});
    const el = document.documentElement;
    const fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fs) fs.call(el).catch?.(() => {});
  });
</script>
</body>
</html>
