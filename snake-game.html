<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>얼굴 뱀 게임</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #182032;
    --grid-a: #1d2a40;
    --grid-b: #213049;
    --text: #eef2ff;
    --muted: #9aa6c4;
    --accent: #ffcc33;
    --body: #1f2a4d;
    --stripe: #d63a3a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 16px 20px;
    touch-action: none; user-select: none;
  }
  h1 { font-size: 22px; margin: 4px 0 8px; letter-spacing: -0.5px; }
  .hud {
    width: 100%; max-width: 480px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-size: 15px; color: var(--muted);
  }
  .hud b { color: var(--text); font-size: 18px; }
  .hud button {
    background: var(--panel); color: var(--text); border: 1px solid #2c3a58;
    border-radius: 8px; padding: 6px 10px; font-size: 14px; cursor: pointer;
  }
  .wrap { position: relative; width: 100%; max-width: 480px; aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 12px; background: #b5df80; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center;
    background: rgba(10, 14, 24, 0.72); border-radius: 12px; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay img { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--accent); }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .overlay button {
    background: var(--accent); color: #222; border: 0; border-radius: 10px;
    padding: 12px 28px; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .pad {
    margin-top: 14px; display: grid; gap: 8px;
    grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px);
  }
  .pad button {
    background: var(--panel); color: var(--text); border: 1px solid #2c3a58;
    border-radius: 12px; font-size: 24px; cursor: pointer;
  }
  .pad button:active { background: #2a3a5c; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .hint { margin-top: 10px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>

  const $ = id => document.getElementById(id);
  const scoreEl = $("score"), bestEl = $("best"), overlay = $("overlay");

  // ---------- 효과음 (Web Audio로 직접 합성) ----------
  let actx = null, soundOn = true;
  function audio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone({ freq = 440, to = null, dur = 0.12, type = "square", vol = 0.15, delay = 0 }) {
    if (!soundOn) return;
    const a = audio(), t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur = 0.4, vol = 0.25) {
    if (!soundOn) return;
    const a = audio(), len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 900;
    g.gain.value = vol;
    src.buffer = buf;
    src.connect(f).connect(g).connect(a.destination);
    src.start();
  }
  const sfx = {
    start() { [523, 659, 784, 1047].forEach((f, i) => tone({ freq: f, dur: 0.1, delay: i * 0.08, vol: 0.12 })); },
    eat()   { tone({ freq: 600, to: 1200, dur: 0.09, vol: 0.14 }); tone({ freq: 1200, to: 1800, dur: 0.08, delay: 0.07, vol: 0.1 }); },
    turn()  { tone({ freq: 220, dur: 0.03, type: "triangle", vol: 0.06 }); },
    level() { [784, 988, 1175].forEach((f, i) => tone({ freq: f, dur: 0.08, delay: i * 0.06, type: "triangle", vol: 0.12 })); },
    over()  { noise(0.35, 0.3); [440, 370, 311, 262].forEach((f, i) => tone({ freq: f, dur: 0.18, delay: 0.15 + i * 0.16, type: "sawtooth", vol: 0.1 })); },
    pause() { tone({ freq: 330, dur: 0.08, type: "triangle", vol: 0.1 }); },
  };

  // ---------- 게임 상태 ----------
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  let snake, dir, queue, food, score, best = 0, stepMs, timer = null, running = false, paused = false;
  let eatPulse = 0, lastDx = 1, popups = [];

  try { best = +localStorage.getItem("faceSnakeBest") || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 6, y: 8 }, { x: 5, y: 8 }, { x: 4, y: 8 }];
    dir = "right"; queue = []; popups = []; score = 0; stepMs = 150; lastDx = 1;
    scoreEl.textContent = 0;
    placeFood();
  }
  function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }
  function setDir(d) {
    if (!running || paused) return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    const [lx, ly] = DIRS[last], [nx, ny] = DIRS[d];
    if (d === last || (lx + nx === 0 && ly + ny === 0)) return;
    if (queue.length < 3) { queue.push(d); sfx.turn(); }
  }
  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    if (dx) lastDx = dx;
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    const willEat = head.x === food.x && head.y === food.y;
    const body = willEat ? snake : snake.slice(0, -1);
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || body.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }
    snake.unshift(head);
    if (willEat) {
      score++; scoreEl.textContent = score; eatPulse = 1;
      popups.push({ x: head.x * C + C / 2, y: head.y * C, t: Date.now() });
      if (score % 5 === 0) { stepMs = Math.max(70, stepMs - 12); sfx.level(); restartTimer(); }
      else sfx.eat();
      placeFood();
    } else snake.pop();
  }
  function restartTimer() { clearInterval(timer); timer = setInterval(step, stepMs); }
  function start() {
    audio(); reset(); running = true; paused = false;
    overlay.classList.add("hidden"); sfx.start(); restartTimer();
  }
  function gameOver() {
    running = false; clearInterval(timer); sfx.over();
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem("faceSnakeBest", best); } catch (e) {}
    }
    $("ovTitle").textContent = "게임 오버!";
    $("ovText").innerHTML = `점수: <b style="color:#fff">${score}</b> · 최고: ${best}`;
    $("startBtn").textContent = "다시 하기";
    overlay.classList.remove("hidden");
  }
  function togglePause() {
    if (!running) return;
    paused = !paused; sfx.pause();
    if (paused) clearInterval(timer); else restartTimer();
  }

  // ---------- 그리기 ----------
  function draw() {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      ctx.fillStyle = (x + y) % 2 ? "#a8d672" : "#b5df80";
      ctx.fillRect(x * C, y * C, C, C);
    }
    // 사과
    const fx = food.x * C + C / 2, fy = food.y * C + C / 2, bob = Math.sin(Date.now() / 200) * 2;
    ctx.fillStyle = "#ff4d4d";
    ctx.beginPath(); ctx.arc(fx, fy + bob, C * 0.36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.beginPath(); ctx.arc(fx - C * 0.12, fy - C * 0.12 + bob, C * 0.09, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4caf50";
    ctx.beginPath(); ctx.ellipse(fx + C * 0.1, fy - C * 0.36 + bob, C * 0.13, C * 0.07, -0.6, 0, Math.PI * 2); ctx.fill();

    // 몸통 (꼬리부터, 남색 체육복 + 빨간 줄무늬)
    for (let i = snake.length - 1; i >= 1; i--) {
      const s = snake[i], r = C * (0.42 - Math.min(i, 20) * 0.006);
      const cx = s.x * C + C / 2, cy = s.y * C + C / 2;
      ctx.fillStyle = "#1f2a4d";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      if (i % 2 === 0) {
        ctx.strokeStyle = "#d63a3a"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // 머리 = 얼굴
    const h = snake[0], scale = 1.25 + eatPulse * 0.35;
    const hx = h.x * C + C / 2, hy = h.y * C + C / 2, size = C * scale;
    ctx.save();
    ctx.translate(hx, hy);
    if (lastDx < 0) ctx.scale(-1, 1);       // 왼쪽으로 갈 땐 얼굴 좌우 반전
    ctx.fillStyle = "#ffcc33";
    ctx.beginPath(); ctx.arc(0, 0, size / 2 + 2, 0, Math.PI * 2); ctx.fill();
    if (face.complete) ctx.drawImage(face, -size / 2, -size / 2, size, size);
    ctx.restore();
    eatPulse = Math.max(0, eatPulse - 0.08);

    // 사과 먹을 때 떠오르는 축하 문구
    const now = Date.now();
    popups = popups.filter(p => now - p.t < 1400);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "900 30px system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
    ctx.lineJoin = "round";
    for (const p of popups) {
      const k = (now - p.t) / 1400;
      const half = ctx.measureText("윤관이 생일축하!").width / 2 + 8;
      const x = Math.min(Math.max(p.x, half), canvas.width - half);
      const y = Math.max(p.y - k * 60, 24);
      const pop = k < 0.15 ? 0.6 + k / 0.15 * 0.5 : 1.1 - Math.min(k - 0.15, 0.1);
      ctx.save();
      ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      ctx.translate(x, y); ctx.scale(pop, pop);
      ctx.lineWidth = 6; ctx.strokeStyle = "#fff";
      ctx.strokeText("윤관이 생일축하!", 0, 0);
      ctx.fillStyle = "#e60012";
      ctx.fillText("윤관이 생일축하!", 0, 0);
      ctx.restore();
    }

    if (paused) {
      ctx.fillStyle = "rgba(10,14,24,.6)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff"; ctx.font = "bold 32px system-ui"; ctx.textAlign = "center";
      ctx.fillText("일시정지", canvas.width / 2, canvas.height / 2);
    }
    requestAnimationFrame(draw);
  }

  // ---------- 입력 ----------
  const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
  addEventListener("keydown", e => {
    if (KEYS[e.key]) { e.preventDefault(); setDir(KEYS[e.key]); }
    else if (e.key === " ") { e.preventDefault(); running ? togglePause() : start(); }
    else if (e.key === "Enter" && !running) start();
  });
  document.querySelectorAll(".pad button").forEach(b =>
    b.addEventListener("pointerdown", e => { e.preventDefault(); setDir(b.dataset.dir); }));
  let t0 = null;
  canvas.addEventListener("touchstart", e => { t0 = e.touches[0]; }, { passive: true });
  canvas.addEventListener("touchend", e => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    t0 = null;
  });
  $("startBtn").addEventListener("click", start);
  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    $("soundBtn").textContent = soundOn ? "🔊 소리 켬" : "🔇 소리 끔";
    if (soundOn) tone({ freq: 880, dur: 0.08, vol: 0.1 });
  });

  reset();
  draw();
})();
